name: Build Uploader Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel any in-progress run for the same branch/PR when a new commit is pushed.
# This avoids queuing up 9×2 = 18 Unity jobs every time you push during active development.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.unityVersion }} — ${{ matrix.testMode }}
    runs-on: ubuntu-latest

    strategy:
      # fail-fast: false is correct for a compatibility matrix.
      # With true, a failure on 2019.4 cancels your 6000.4 run before it finishes,
      # so you never learn whether the failure is version-specific or universal.
      fail-fast: false

      matrix:
        unityVersion:
          - '6000.4.5f1'
          - '6000.3.5f1'
          - '6000.2.9f1'
          - '6000.1.17f1'
          - '6000.0.68f1'
          - '2022.3.62f3'
          - '2021.3.45f2'
          - '2020.3.49f1'
          - '2019.4.41f1'
        testMode:
          - editmode
        include:
          - unityVersion: '6000.4.5f1'
            packagePins: '{"com.unity.test-framework":"1.6.0","com.unity.ugui":"1.0.0"}'
          - unityVersion: '6000.3.5f1'
            packagePins: '{"com.unity.test-framework":"1.6.0","com.unity.ugui":"1.0.0"}'
          - unityVersion: '6000.2.9f1'
            packagePins: '{"com.unity.test-framework":"1.6.0","com.unity.ugui":"1.0.0"}'
          - unityVersion: '6000.1.17f1'
            packagePins: '{"com.unity.test-framework":"1.6.0","com.unity.ugui":"1.0.0"}'
          - unityVersion: '6000.0.68f1'
            packagePins: '{"com.unity.test-framework":"1.6.0","com.unity.ugui":"1.0.0"}'
          - unityVersion: '2022.3.62f3'
            packagePins: '{"com.unity.test-framework":"1.6.0","com.unity.ugui":"1.0.0"}'
          - unityVersion: '2021.3.45f2'
            packagePins: '{"com.unity.test-framework":"1.1.33","com.unity.ugui":"1.0.0"}'
          - unityVersion: '2020.3.49f1'
            packagePins: '{"com.unity.test-framework":"1.1.33","com.unity.ugui":"1.0.0"}'
          - unityVersion: '2019.4.41f1'
            packagePins: '{"com.unity.test-framework":"1.1.31","com.unity.ugui":"1.0.0"}'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: true

      # Cache key includes Unity version so different Unity versions never share a Library folder.
      # Secondary restore keys fall back gracefully when the exact key is missing (e.g. after a
      # package change) rather than starting cold every time.
      - name: Restore Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.unityVersion }}-${{ matrix.testMode }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'Assets/**/*.asmdef', 'Packages/**/*.asmdef') }}
          restore-keys: |
            Library-${{ matrix.unityVersion }}-${{ matrix.testMode }}-
            Library-${{ matrix.unityVersion }}-

      # Pins per-version package versions in manifest.json and deletes the lock
      # so Unity re-resolves cleanly against the pinned versions.
      #
      # Intentionally does NOT touch com.veugeljame.builduploader — that entry
      # already exists correctly in manifest.json as file:com.veugeljame.builduploader,
      # pointing at Packages/com.veugeljame.builduploader which is checked out
      # as part of this repo. Overwriting it here previously caused Unity to fail
      # to resolve the package inside the game-ci Docker container.
      - name: Pin packages for Unity ${{ matrix.unityVersion }}
        shell: bash
        env:
          PACKAGE_PINS: ${{ matrix.packagePins }}
        run: |
          node <<'NODE'
          const fs   = require('fs');
          const path = require('path');

          const manifestPath = path.join('Packages', 'manifest.json');
          const lockPath     = path.join('Packages', 'packages-lock.json');

          const manifest    = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const packagePins = JSON.parse(process.env.PACKAGE_PINS || '{}');

          // Apply per-version package pins only.
          // Do not modify com.veugeljame.builduploader — it is already correctly
          // declared in manifest.json and lives in this repo under Packages/.
          for (const [pkg, version] of Object.entries(packagePins)) {
            manifest.dependencies[pkg] = version;
          }

          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');

          // Remove the lock so Unity re-resolves against the patched manifest.
          if (fs.existsSync(lockPath)) {
            fs.rmSync(lockPath);
          }

          console.log('Patched manifest.json:');
          console.log(JSON.stringify(manifest.dependencies, null, 2));
          NODE

      - name: Run ${{ matrix.testMode }} tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:   ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion:  ${{ matrix.unityVersion }}
          testMode:      ${{ matrix.testMode }}
          artifactsPath: ${{ matrix.testMode }}-artifacts
          githubToken:   ${{ secrets.GITHUB_TOKEN }}
          checkName:     ${{ matrix.unityVersion }} ${{ matrix.testMode }} Results

      # Upload artifacts on failure only during normal development to save storage.
      # Switch `if: failure()` to `if: always()` when actively debugging a specific version.
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          # Artifact names must be unique across the matrix or uploads will silently overwrite each other.
          name: Results — ${{ matrix.unityVersion }} ${{ matrix.testMode }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          # Discard old artifacts after 30 days to avoid storage accumulation across hundreds of runs.
          retention-days: 30
